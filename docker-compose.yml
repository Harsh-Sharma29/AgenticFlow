# ═══════════════════════════════════════════════════════════════════
# Nexus AI Orchestrator – Docker Compose
# ═══════════════════════════════════════════════════════════════════
# Usage:
#   docker compose up --build        # Build & start all services
#   docker compose up -d             # Detached mode
#   docker compose logs -f backend   # Tail backend logs
#   docker compose down              # Stop & remove containers
# ═══════════════════════════════════════════════════════════════════


services:
  # ── Memgraph (Graph Database) ─────────────────────────────────────
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: nexus-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: .                      # Project root (backend imports use backend.app.*)
      dockerfile: backend/Dockerfile
    container_name: nexus-backend
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/memory.db
      - MEMGRAPH_URI=bolt://memgraph:7687
    volumes:
      - backend-data:/app/data        # Persist SQLite + FAISS indexes
      - ./workspaces:/app/workspaces  # Shared workspace files (uploads)
    restart: unless-stopped
    depends_on:
      memgraph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Next.js Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./nexus-frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8005
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
  memgraph-data:
    driver: local

