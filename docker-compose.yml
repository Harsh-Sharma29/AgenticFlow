# ═══════════════════════════════════════════════════════════════════
# AgenticFlow Orchestrator – Docker Compose
# ═══════════════════════════════════════════════════════════════════
# Usage:
#   docker compose up --build        # Build & start all services
#   docker compose up -d             # Detached mode
#   docker compose logs -f backend   # Tail backend logs
#   docker compose down              # Stop & remove containers
# ═══════════════════════════════════════════════════════════════════


services:
  # ── PostgreSQL (Relational Database) ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: agenticflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agenticflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Memgraph (Graph Database) ─────────────────────────────────────
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: agenticflow-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: .                      # Project root (backend imports use backend.app.*)
      dockerfile: backend/Dockerfile
    container_name: agenticflow-backend
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_URI=postgresql://postgres:password@postgres:5432/agenticflow
    volumes:
      - backend-data:/app/data        # Persist standard files
      - ./backend:/app/backend        # Hot reload backend source
      - ./workspaces:/app/workspaces  # Shared workspace files (uploads)
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8005"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Next.js Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./nexus-frontend
      dockerfile: Dockerfile
    container_name: agenticflow-frontend
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8005
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
  memgraph-data:
    driver: local
  postgres-data:
    driver: local

