name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nexus-frontend/package-lock.json
          
      - name: Frontend Validation
        working-directory: ./nexus-frontend
        run: |
          npm ci
          npm run lint
          npm run build
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Backend Validation (Lightweight)
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "=== Deployment started ==="
            cd /home/ubuntu/AgenticFlow
            
            echo "=== Updating code from GitHub ==="
            git fetch origin main
            git reset --hard origin/main
            
            echo "=== Building Docker images ==="
            docker compose build
            
            echo "=== Restarting services ==="
            docker compose up -d
            
            echo "=== Waiting for services to stabilize ==="
            sleep 5
            
            echo "=== Deployment finished. Current services status ==="
            docker compose ps
            
            if docker compose ps | grep -iE "exit|restarting|created"; then
              echo "Error: One or more services are not running properly."
              exit 1
            fi
